    <!-- Left Person (Blue) -->
    <!-- Head -->
    <circle cx="31" cy="38" r="5.5" fill="#009fe3" />
    <!-- Body -->
    <path d="M 23 58 C 23 48, 39 48, 39 58 Z" fill="#009fe3" />

    <!-- Center Person (Green - Taller) -->
    <!-- Head -->
    <circle cx="45" cy="31" r="6" fill="#235c27" />
    <!-- Body -->
    <path d="M 36 58 C 36 45, 54 45, 54 58 Z" fill="#235c27" />

    <!-- Right Person (Purple) -->
    <!-- Head -->
    <circle cx="59" cy="38" r="5.5" fill="#52247f" />
    <!-- Body -->
    <path d="M 51 58 C 51 48, 67 48, 67 58 Z" fill="#52247f" />

    <!-- Cupped Supporting Hands (Dark Charcoal/Black) -->
    <!-- Left Hand -->
    <path d="M 12 47 C 14 55, 17 65, 29 73 C 33 76, 39 77, 43 78 C 38 78, 29 74, 23 68 C 17 62, 14 55, 12 47 Z" fill="#1a1a1a" />
    <path d="M 15 50 C 18 64, 27 75, 43 78 C 35 77, 24 72, 18 62 C 14 55, 13 50, 15 50 Z" fill="#1a1a1a" />
    <!-- Left cupping palm & fingers -->
    <path d="M 13 46 C 18 56, 26 73, 44 77 C 40 76, 32 74, 25 66 C 18 59, 14 51, 13 46 Z" fill="#1a1a1a" />

    <!-- Right Hand -->
    <path d="M 77 46 C 72 56, 64 73, 46 77 C 50 76, 58 74, 65 66 C 72 59, 76 51, 77 46 Z" fill="#1a1a1a" />

