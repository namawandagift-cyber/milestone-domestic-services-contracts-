  </g>

  <!-- Wordmark Text -->
  <g transform="translate(110, 10)">
    <!-- "Milestone" in Heavy Royal Purple -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#52247f" letter-spacing="-1">Milestone</text>

    <!-- "Domestic Services Ltd" in Forest Green -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="19" fill="#235c27" letter-spacing="0.2">Domestic Services Ltd</text>

    <!-- Tagline: "Professionalizing domestic work" in Dark Charcoal -->
    <text x="0" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" fill="#1a1a1a" letter-spacing="0.1">Professionalizing domestic work</text>
